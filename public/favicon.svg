<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gc-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#2a65c7"/>
    </linearGradient>
    <linearGradient id="gc-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#c5221f"/>
    </linearGradient>
    <linearGradient id="gc-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC04"/>
      <stop offset="100%" stop-color="#f29900"/>
    </linearGradient>
    <linearGradient id="gc-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#188038"/>
    </linearGradient>
  </defs>
  <!-- Sleek dark squircle backing ensures high contrast on all browser themes -->
  <rect width="64" height="64" rx="16" fill="#0D1117" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  
  <!-- Multi-color Google Cloud outline -->
  <!-- Left puff (Yellow) -->
  <path d="M12 34a8 8 0 0 1 8-8c.4 0 .9.04 1.3.1" stroke="url(#gc-yellow)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Top-left puff (Red) -->
  <path d="M23 23.5A11 11 0 0 1 38 18" stroke="url(#gc-red)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Right puff (Blue) -->
  <path d="M40 18.5a10 10 0 0 1 11.8 11.8A8 8 0 0 1 48 42" stroke="url(#gc-blue)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Bottom bar (Green) -->
  <path d="M18 42h28" stroke="url(#gc-green)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Bottom-left corner connect -->
  <path d="M12 34a8 8 0 0 0 6 8" stroke="url(#gc-yellow)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Developer Code Symbol in Center -->
  <path d="M26 28l-4 4 4 4" stroke="#F0F6FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 28l4 4-4 4" stroke="#F0F6FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M33 27l-3 10" stroke="#4285F4" stroke-width="2.2" stroke-linecap="round"/>
</svg>
